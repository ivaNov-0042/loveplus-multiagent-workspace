# aqt 镜像配置（供 fetch_qt.sh 使用）
#
# 为什么不复用 tools/azahar/CMakeModules/aqt_config.ini：
#   它把国内镜像列进 blacklist，fallback 全是日本/欧洲镜像，实测 download.qt.io
#   被 302 重定向到 ftp.jaist.ac.jp，只有 28~32 kB/s。
#
# 两个键的分工（读 aqt 源码确认）：
#   [aqt] baseurl            —— 「包本体」（.7z）从哪下
#   [mirrors] trusted_mirrors —— 元数据索引（Updates.xml）与校验和（.sha256）从哪取
# 命令行 -b/--base 只能指定前者，管不到后者；只想用 -b 换镜像会失效。
#
# mirrors.aliyun.com 有 .7z 但没有 .sha256（404）。缺校验和只是 warning 不致命
# （aqt/archives.py:_download_update_xml 捕获 ChecksumDownloadFailure），
# 但每次尝试会多花若干次 404 请求，故把官方放第二位做回落。
#
# 2026-10-17 python 栈实测速度：aliyun 20.3MB/s、nju 3.96、tencent 3.12、
# ustc 403（限流）、download.qt.io 28kB/s。
[aqt]
baseurl = https://mirrors.aliyun.com/qt
concurrency = 2

[mirrors]
trusted_mirrors =
    https://mirrors.aliyun.com/qt
    https://download.qt.io

[requests]
connection_timeout = 15
response_timeout = 120
max_retries = 6
